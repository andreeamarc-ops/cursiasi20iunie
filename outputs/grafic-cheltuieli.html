  p.sub { color: #666; font-size: 0.85rem; margin-top: 0; }
  /* Bar chart */

  .bar-label { width: 100px; font-size: 0.85rem; text-align: right; padding-right: 10px; }
  .bar { height: 22px; background: #4a90d9; border-radius: 3px; min-width: 2px; transition: width 0.3s; }
  .bar-val { font-size: 0.8rem; padding-left: 8px; color: #444; }
  /* Table */
  input#search { padding: 6px 10px; width: 260px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: #f0f4f8; cursor: pointer; user-select: none; padding: 7px 10px; text-align: left; border-bottom: 2px solid #ccc; }
  th:hover { background: #dce8f5; }
  td { padding: 6px 10px; border-bottom: 1px solid #eee; }
  tr:hover td { background: #f7fbff; }
  .sum { font-weight: bold; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 0.75rem; background: #e8f0fe; color: #1a56d6; }
</style>

<body>

<div class="chart" id="chart"></div>

];

const totals = {};
data.forEach(r => { totals[r[1]] = (totals[r[1]]||0) + r[4]; });
const maxVal = Math.max(...Object.values(totals));
const chartEl = document.getElementById('chart');
Object.entries(totals).sort((a,b)=>b[1]-a[1]).forEach(([cat, val]) => {
  const pct = (val / maxVal * 400).toFixed(0);
  chartEl.innerHTML += `<div class="bar-row">
    <div class="bar-label">${cat}</div>
    <div class="bar" style="width:${pct}px"></div>
    <div class="bar-val">${val.toLocaleString('ro-RO')} lei</div>
  </div>`;
});

let sortCol = 0, sortAsc = true;
function fmt(v) { return typeof v === 'number' ? v.toLocaleString('ro-RO') : v; }

function render(rows) {
  document.getElementById('tbody').innerHTML = rows.map(r =>
    `<tr><td>${r[0]}</td><td><span class="badge">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td style="text-align:right" class="sum">${fmt(r[4])}</td></tr>`
  ).join('');
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  return data.filter(r => r.some(v => String(v).toLowerCase().includes(q)));
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
  const rows = filtered().sort((a,b) => {
    const x = a[col], y = b[col];
    return sortAsc ? (x < y ? -1 : x > y ? 1 : 0) : (x > y ? -1 : x < y ? 1 : 0);
  });
  render(rows);
}

document.getElementById('search').addEventListener('input', () => render(filtered()));
render(data);
</script>
</body>
